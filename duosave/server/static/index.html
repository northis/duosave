<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e8">
  <title>Duosave</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png">
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>🦉 Duosave</h1>
    <nav class="nav">
      <a href="/" class="active" data-i18n="nav_cards">Карточки</a>
      <a href="/review" data-i18n="nav_review">Проверка</a>
      <a href="/admin" id="nav-admin" data-i18n="nav_admin" hidden>Обслуживание</a>
    </nav>
    <div class="spacer"></div>
    <div class="lang">
      <a href="#" data-lang="ru" class="active">RU</a>
      <a href="#" data-lang="en">EN</a>
    </div>
    <button id="upload-btn" class="theme-btn" title="upload" aria-expanded="false"
            aria-controls="upload-panel" data-i18n-title="upload_btn">⬆</button>
    <button id="theme-btn" class="theme-btn" title="theme">🌙</button>
    <span id="build-badge" class="build-badge" hidden>
      <a id="build-version" target="_blank" rel="noopener"></a>
      <a id="build-commit" target="_blank" rel="noopener" hidden></a>
    </span>
  </header>

  <section id="upload-panel" class="upload-panel" hidden>
    <div id="drop-zone" class="drop-zone">
      <p class="upload-hint" data-i18n="upload_hint">Перетащите картинку сюда или выберите файл</p>
      <label class="btn upload-pick" for="upload-input" data-i18n="upload_btn">Загрузить картинку</label>
      <input id="upload-input" class="upload-input" type="file" multiple accept="image/*">
    </div>
    <div id="upload-results" class="upload-results" aria-live="polite"></div>
  </section>

  <div class="search-row">
    <input id="search" class="search" type="search" data-i18n-ph="search_ph" placeholder="Поиск по оригиналу и переводу…" autocomplete="off">
    <div class="chips" id="lang-chips">
      <button class="chip active" data-value="" data-i18n="all">Все</button>
      <button class="chip" data-value="pl">PL</button>
      <button class="chip" data-value="es">ES</button>
      <button class="chip" data-value="pt">PT</button>
    </div>
    <div class="chips" id="app-chips">
      <button class="chip active" data-value="" data-i18n="all">Все</button>
      <button class="chip" data-value="duolingo">Duolingo</button>
      <button class="chip" data-value="drops">Drops</button>
    </div>
    <div class="chips" id="sort-chips">
      <button class="chip active" data-value="new" data-i18n="sort_new">Сначала новые</button>
      <button class="chip" data-value="old" data-i18n="sort_old">Сначала старые</button>
    </div>
    <div class="chips" id="mode-chips">
      <button class="chip" data-value="text" data-i18n="mode_text">Текст</button>
      <button class="chip active" data-value="hybrid" data-i18n="mode_hybrid">Гибрид</button>
      <button class="chip" data-value="semantic" data-i18n="mode_semantic">Смысл</button>
    </div>
  </div>

  <div class="stats-line" id="stats-line"></div>
  <section id="cards" class="cards"></section>
  <div id="empty" class="empty" style="display:none" data-i18n="empty">Ничего не найдено</div>
  <button id="more" class="more" style="display:none" data-i18n="more">Показать ещё</button>
</div>

<div id="modal-back" class="modal-back" style="display:none">
  <div class="modal">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>initIndex();</script>
</body>
</html>
