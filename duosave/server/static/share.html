<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e8">
  <title>Duosave — итог шары</title>
  <script>
    /* Theme before the first paint: the boot screen, the page and the browser chrome follow the
       stored theme, or the system one while the reader has not picked yet. app.js reads the same
       attribute back, so the toggle and this script cannot disagree. */
    (function () {
      var stored = localStorage.getItem("duosave_theme");
      var dark = stored ? stored === "dark"
        : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = dark ? "#16171b" : "#f6f1e8";
      /* The boot screen belongs to the launch, not to every navigation: skip it once this tab has
         shown it. /share is always a launch — the share sheet opens it with the app cold. */
      try {
        var launch = location.pathname === "/share" || !sessionStorage.getItem("duosave_booted");
        sessionStorage.setItem("duosave_booted", "1");
        if (!launch) document.documentElement.dataset.boot = "skip";
      } catch (err) { /* no session storage: the boot screen shows, the safe side */ }
    })();
  </script>
  <style>
    /* Boot screen: the first frame of the page, painted while style.css is still on the wire —
       before it there is only the OS splash, drawn from the manifest. app.js fades it out once
       the first page has rendered (bootDone). */
    html { background: #f6f1e8; }
    html[data-theme="dark"] { background: #16171b; }
    #boot { position: fixed; inset: 0; z-index: 60; display: grid; place-content: center;
      justify-items: center; background: #f6f1e8; color: #20170f;
      font: 400 0.9rem/1.4 "Segoe UI", "Helvetica Neue", sans-serif; }
    #boot .boot-owl { font-size: 64px; line-height: 1; animation: boot-pulse 1.4s ease-in-out infinite; }
    #boot .boot-label { margin-top: 12px; letter-spacing: 0.02em; opacity: 0.7; }
    #boot .boot-bar { position: relative; width: 120px; height: 4px; margin-top: 14px;
      border-radius: 999px; background: rgba(84, 59, 37, 0.14); overflow: hidden; }
    #boot .boot-bar span { position: absolute; top: 0; bottom: 0; left: -40%; width: 40%;
      border-radius: 999px; background: #d2693c; animation: boot-slide 1.2s ease-in-out infinite; }
    html[data-theme="dark"] #boot { background: #16171b; color: #ecebe6; }
    html[data-theme="dark"] #boot .boot-bar { background: rgba(255, 255, 255, 0.12); }
    html[data-theme="dark"] #boot .boot-bar span { background: #e5865a; }
    #boot.boot-done { opacity: 0; transition: opacity 0.25s ease-out; pointer-events: none; }
    html[data-boot="skip"] #boot { display: none; } /* a navigation inside the app: no launch screen */
    @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes boot-slide { from { left: -40%; } to { left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      #boot .boot-owl, #boot .boot-bar span { animation: none; }
      #boot .boot-bar span { left: 30%; }
    }
  </style>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png">
</head>
<body>
<div id="boot" role="status" aria-live="polite">
  <div class="boot-owl" aria-hidden="true">🦉</div>
  <div class="boot-label" data-i18n="loading">Загрузка…</div>
  <div class="boot-bar" aria-hidden="true"><span></span></div>
</div>
<div class="shell">
  <header class="top">
    <h1>🦉 Duosave</h1>
    <nav class="nav">
      <a href="/" data-i18n="nav_cards">Карточки</a>
      <a href="/review" data-i18n="nav_review">Проверка</a>
      <a href="/admin" id="nav-admin" data-i18n="nav_admin" hidden>Обслуживание</a>
    </nav>
    <div class="spacer"></div>
    <div class="lang">
      <a href="#" data-lang="ru" class="active">RU</a>
      <a href="#" data-lang="en">EN</a>
    </div>
    <button id="upload-btn" class="theme-btn" title="upload" aria-expanded="false"
            aria-controls="upload-panel" data-i18n-title="upload_btn" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20V6"/><path d="m5 12 7-7 7 7"/>
      </svg>
    </button>
    <button id="theme-btn" class="theme-btn" title="theme">🌙</button>
    <span id="build-badge" class="build-badge" hidden>
      <a id="build-version" target="_blank" rel="noopener"></a>
      <a id="build-commit" target="_blank" rel="noopener" hidden></a>
    </span>
  </header>

  <section id="upload-panel" class="upload-panel" hidden>
    <div id="drop-zone" class="drop-zone">
      <p class="upload-hint" data-i18n="upload_hint">Перетащите картинку сюда или выберите файл</p>
      <label class="btn upload-pick" for="upload-input" data-i18n="upload_btn">Загрузить картинку</label>
      <input id="upload-input" class="upload-input" type="file" multiple accept="image/*">
    </div>
    <div id="upload-results" class="upload-results" aria-live="polite"></div>
  </section>

  <main id="share">
    <h2 data-i18n="share_title">Итог шары</h2>
    <p id="share-summary" class="stats-line"></p>
    <p id="share-note" class="stats-line" hidden></p>
    <p id="share-redirect" class="stats-line" data-i18n="share_redirect" hidden>Открываю главную…</p>
    <div class="share-actions">
      <a id="share-open-card" class="btn" href="/" data-i18n="share_open_card" hidden>Открыть карточку</a>
      <a class="btn" href="/review" data-i18n="share_to_review">В «Проверку»</a>
      <a class="btn" href="/" data-i18n="share_to_search">В поиск</a>
    </div>
  </main>
</div>

<script src="/static/app.js"></script>
<script>initSharePage();</script>
</body>
</html>
