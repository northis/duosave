<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duosave — проверка</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>🦉 Duosave</h1>
    <nav class="nav">
      <a href="/" data-i18n="nav_cards">Карточки</a>
      <a href="/review" class="active" data-i18n="nav_review">Проверка</a>
    </nav>
    <div class="spacer"></div>
    <div class="lang">
      <a href="#" data-lang="ru" class="active">RU</a>
      <a href="#" data-lang="en">EN</a>

</html>
