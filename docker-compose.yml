# Duosave: site + SQLite database + images.
# All state lives on the host (./data, ./pictures, ./screens, ./screens_raw) and is
# bind-mounted into the container, so the image can be rebuilt or removed freely.
# Paths and the published ports can be overridden in .env (see .env.example).
services:
  duosave:
    build:
      context: .
      args:
        DUOSAVE_COMMIT: "${DUOSAVE_COMMIT:-}"
        DUOSAVE_COMMIT_DATE: "${DUOSAVE_COMMIT_DATE:-}"
        DUOSAVE_VERSION: "${DUOSAVE_VERSION:-}"
        DUOSAVE_CREATED: "${DUOSAVE_CREATED:-}"
    image: duosave:latest
    container_name: duosave
    restart: unless-stopped
    ports:
      # Site: all interfaces by default; DUOSAVE_BIND_ADDR=10.77.77.21 publishes it on the
      # VPN address only (Traefik connects to that address).
      - "${DUOSAVE_BIND_ADDR:-0.0.0.0}:${DUOSAVE_PORT:-8765}:8765"
      # Maintenance: local network only (VPN by default). 127.0.0.1 keeps it on this
      # machine; the container fails to start if the address does not exist yet.
      - "${DUOSAVE_ADMIN_BIND_ADDR:-10.77.77.21}:${DUOSAVE_ADMIN_PORT:-8766}:8766"
    environment:
      # listen on all interfaces so the published ports work
      DUOSAVE_HOST: 0.0.0.0
      DUOSAVE_ADMIN_HOST: 0.0.0.0
      # the commit is baked at build time (see Dockerfile): DUOSAVE_COMMIT is a build arg now
      DUOSAVE_REPO_URL: "${DUOSAVE_REPO_URL:-}"
    volumes:
      # database (duosave.db + WAL), OCR cache, Drops crops, thumbnails, embedding model, wordlists
      - "${DUOSAVE_DATA_DIR:-./data}:/app/data"
      # source images: drop new files here, then run
      #   docker compose exec duosave python -m duosave sync
      - "${DUOSAVE_PICTURES_DIR:-./pictures}:/app/pictures"
      - "${DUOSAVE_SCREENS_DIR:-./screens}:/app/screens"
      - "${DUOSAVE_SCREENS_RAW_DIR:-./screens_raw}:/app/screens_raw"
